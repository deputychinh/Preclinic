[project]
name = "carepath-backend"
version = "0.1.0"
description = "CarePath clinical care coordination API (Django, DRF, Celery)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-filter>=24.3",
    "django-cors-headers>=4.4",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "redis>=5.2",
    "anthropic>=0.39",
    "gunicorn>=23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "DJ", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806"]
"*/tests/*" = ["S101", "PLR2004"]
"config/settings/*" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["celery.*", "factory.*", "anthropic.*", "django_celery_beat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy's DjangoModelFactory isn't generically typed over the model it builds, so every
# factory attribute/call site looks untyped to mypy even though it's correct at runtime (verified
# by the tests actually passing against a real Postgres). Tests are pytest-only call sites.
module = ["apps.*.tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
