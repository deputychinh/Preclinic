name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carepath_test
          POSTGRES_USER: carepath
          POSTGRES_PASSWORD: carepath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carepath"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install ".[dev]"
      - run: ruff check .
      - run: mypy apps config
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q --cov=apps --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive infra/terraform
      - run: |
          for env in staging prod; do
            tofu -chdir=infra/terraform/envs/$env init -backend=false -input=false
            tofu -chdir=infra/terraform/envs/$env validate
          done
      - run: shellcheck -x -P scripts/aws scripts/aws/*.sh

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t carepath-backend:ci backend
      - run: docker build -t carepath-frontend:ci frontend
