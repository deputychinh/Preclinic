name: deploy
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  id-token: write # OIDC → AWS, no stored keys
  contents: read

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # Production is a GitHub Environment with required reviewers (manual approval).
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    env:
      ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - run: scripts/aws/deploy.sh "$ENV" "${GITHUB_SHA::12}"
